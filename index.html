<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.json" />
  <title>Form Offline + 2 Foto</title>

  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 16px; color:#0f172a; }
    .card { border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-bottom:14px; }
    label { display:block; font-weight:600; margin-top:10px; }
    input, textarea, select { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:10px; margin-top:6px; box-sizing:border-box; }
    button { padding:10px 12px; border:0; border-radius:10px; cursor:pointer; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .row > div { flex:1 1 220px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .primary { background:#0f172a; color:#fff; }
    .secondary { background:#e2e8f0; color:#0f172a; }
    .danger { background:#ef4444; color:#fff; }
    .muted { color:#64748b; font-size: 13px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border-bottom:1px solid #e2e8f0; padding:8px; text-align:left; vertical-align:top; }
    img { max-width:140px; border-radius:10px; border:1px solid #e2e8f0; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; background:#e2e8f0; font-size:12px; }
  </style>
</head>
<body>
  <h2>Form Offline + 2 Foto</h2>
  <p class="muted" id="status">Memuat...</p>

  <div class="card">
    <h3>Input Data</h3>
    <div class="row">
      <div>
        <label>Nomor Pelanggan</label>
        <input id="nama" list="namaList" inputmode="numeric" autocomplete="off" placeholder="Ketik nomor pelanggan (contoh: 123). Akan muncul saran" />
        <datalist id="namaList"></datalist>
        <div id="namaSuggest" class="muted"></div>
      </div>
      <div>
    <label>Tanggal</label>
      <input id="tanggal" type="date" />
    </div>
      <div>
        <label>Kondisi Lapangan</label>
        <select id="kondisiLapangan"></select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Status</label>
        <select id="statusSelect"></select>
      </div>
      <div>
        <label>Nama Cabang</label>
        <select id="cabangSelect"></select>
      </div>
      <div>
        <label>Golongan</label>
        <select id="golonganSelect"></select>
      </div>
    </div>

    <label>Lokasi</label>
    <input id="lokasi" placeholder="Alamat / titik lokasi / catatan lokasi" />

    <label>Catatan</label>
    <textarea id="catatan" rows="3" placeholder="Catatan tambahan..."></textarea>

    <div class="row">
      <div>
        <label>Foto 1</label>
        <input id="foto1" type="file" accept="image/*" capture="environment" />
        <div class="muted" id="prev1">Belum ada.</div>
      </div>
      <div>
        <label>Foto 2</label>
        <input id="foto2" type="file" accept="image/*" capture="environment" />
        <div class="muted" id="prev2">Belum ada.</div>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="btnSimpan">Simpan (offline)</button>
      <button class="secondary" id="btnReset">Reset form</button>
    </div>

    <p class="muted" style="margin-top:10px;">
      Catatan: untuk mode offline penuh, buka lewat <b>HTTP/HTTPS</b> lalu install (PWA).
    </p>
  </div>

  <div class="card">
    <h3>Data Tersimpan</h3>
    <div class="actions">
      <button class="secondary" id="btnRefresh">Refresh</button>
      <button class="secondary" id="btnExportCSV">Export CSV</button>
      <button class="secondary" id="btnExportZIP">Export ZIP (CSV + foto)</button>
      <button class="danger" id="btnHapusSemua">Hapus Semua</button>
    </div>

    <div style="overflow:auto;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>No Pelanggan</th>
            <th>Status</th>
            <th>Cabang</th>
            <th>Golongan</th>
            <th>Kondisi</th>
            <th>Tanggal</th>
            <th>Lokasi</th>
            <th>Catatan</th>
            <th>Foto</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="10" class="muted">Belum ada data.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="./jszip.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
